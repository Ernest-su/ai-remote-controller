name: Prepare signed release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag, such as v0.1.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ format('refs/tags/{0}', inputs.tag || github.ref_name) }}

  release:
    name: Signed APK and runtime release draft
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      ANDROID_NDK_VERSION: 28.2.13676358
    steps:
      - name: Validate requested tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo 'Invalid version tag' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Require a matching tag and project version
        run: |
          git show-ref --verify "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")"
          python3 scripts/build-release.py --tag "$RELEASE_TAG" --validate-only
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK and NDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;$ANDROID_NDK_VERSION"
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore checked runtime build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            runtime/target
          key: android-runtime-${{ runner.os }}-${{ hashFiles('runtime/Cargo.lock') }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Restore release signing material
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          RUNTIME_SIGNING_PRIVATE_KEY: ${{ secrets.RUNTIME_SIGNING_PRIVATE_KEY }}
          RUNTIME_SIGNING_KEY_PASSWORD: ${{ secrets.RUNTIME_SIGNING_KEY_PASSWORD }}
        run: python3 scripts/release_signing.py restore --output "$RUNNER_TEMP/airc-release-signing"
      - name: Build and verify release attachments
        run: |
          python3 scripts/release_signing.py run --secrets-dir "$RUNNER_TEMP/airc-release-signing" -- \
            python3 scripts/build-release.py --tag "$RELEASE_TAG"
      - name: Upload signed build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-${{ env.RELEASE_TAG }}
          path: dist/release/
          if-no-files-found: error
      - name: Create GitHub Release draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)" != "$(git rev-parse HEAD)" ]]; then
            echo 'Tag changed during the build; refusing to create a release draft' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" dist/release/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --draft \
            --title "AIRC $RELEASE_TAG"
      - name: Remove signing material
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/airc-release-signing"
