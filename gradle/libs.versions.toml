[versions]
agp = "9.0.1"
kotlin = "2.2.10"
compose = "1.9.0"
app-name = "0.1.3"
app-code = "4"
adb = "v0.4.0"
coroutines = "1.10.2"
serialization = "1.8.1"
okhttp = "4.12.0"
media3 = "1.10.0"
compose-bom = "2025.08.01"
activity = "1.10.1"
lifecycle = "2.9.2"
zxing = "3.5.4"
junit = "4.13.2"
test-runner = "1.7.0"
test-junit = "1.3.0"
espresso = "3.7.0"
jmdns = "3.6.3"
annotation = "1.9.1"

[libraries]
adb = { module = "com.github.Ernest-su:adb", version.ref = "adb" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
